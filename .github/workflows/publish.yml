name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Dual esbuild (vite 0.25.x + tsup 0.27.x) postinstall races on PATH and
      # can hang then fail with Expected "0.25.12" but got "0.27.7". Optional
      # @esbuild/* platform packages in the lockfile are enough for build.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Full UI suite has locale-sensitive flakes; release gate is build + contract.
      - run: bun run build
      - run: bun run check:release
      # Org policy: no --provenance (keeps repo/commit metadata out of the
      # public Sigstore transparency log, uniform with the private repos).
      - name: Publish to npmjs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
